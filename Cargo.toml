[package]
name = "biblio"
version = "0.1.0"
edition = "2024"
repository = "https://github.com/apanoush/biblio"
authors = ["aa-p"]

[package.metadata.wix]
upgrade-guid = "575B7913-AB5A-43A0-BC4F-19A9F7B04E1B"
path-guid = "72733348-C56B-4BBA-A28A-C70B48976883"
license = false
eula = false

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
console = "0.16.6"
directories = "6.0.0"
indicatif = "0.18.6"
ratatui = "0.30.2"
rayon = "1.12.0"
regex = "1.13.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
shellexpand = "3.1.2"
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
walkdir = "2.5.0"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
